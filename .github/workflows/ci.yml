name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check public/assets/app.js
      - run: node --check public/assets/cloud.js
      - run: node --check public/assets/catalog.js
      - run: node --check public/assets/intent-core.js
      - run: node --check public/assets/finance-core.js
      - run: node --check public/assets/telemetry.js
      - run: node --check src/worker.js
      - run: node --check src/api.js
      - run: node --check src/lib/security.js
      - run: node scripts/test-security.mjs
      - run: node scripts/test-finance-core.mjs
      - run: node scripts/test-intent-core.mjs
      - run: node scripts/verify.mjs
