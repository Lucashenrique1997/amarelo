name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify architecture and product
        run: npm run verify
      - name: Test deterministic finance core
        run: npm run test:finance
      - name: Test 12 priority decision engines
        run: npm run test:engines
      - name: Test Worker and API contracts
        run: npm run test:worker
