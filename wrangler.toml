name = "amarelo"
main = "src/worker.js"
compatibility_date = "2026-09-24"
workers_dev = true
preview_urls = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

